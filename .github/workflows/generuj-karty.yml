name: Generuj karty potworów PDF
on:
  push:
    paths:
      - 'generuj_karty.py'
      - '.github/workflows/generuj-karty.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Zainstaluj ReportLab
        run: pip install reportlab==4.2.5
      - name: Wygeneruj PDF
        run: python generuj_karty.py
      - name: Zapisz PDF w repozytorium
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 01_Salon_Krypta_Szesciu_Bestii/KARTY_POTWOROW.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Wygeneruj karty sześciu bestii do druku"
            git push
          fi
