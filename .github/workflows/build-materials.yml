name: Zbuduj zbiorcze PDF-y Siedmiu Swiatow
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/build_master.py"
      - ".github/workflows/build-materials.yml"
      - "assets/zrodla/**"
      - "tarcze_7_2_4_test.pdf"
permissions:
  contents: write
jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Przygotuj zaleznosci
        run: |
          python3 -m pip install --disable-pip-version-check --break-system-packages reportlab pymupdf
      - name: Zbuduj oba dokumenty
        run: |
          mkdir -p .
          HALLOWEEN_ASSET_DIR="$GITHUB_WORKSPACE" HALLOWEEN_OUT_DIR="$GITHUB_WORKSPACE" python3 tools/build_master.py
          test -s Instrukcja_organizatora.pdf
          test -s Materialy_do_druku.pdf
          python3 - <<'PY'
          import fitz
          a=fitz.open('Instrukcja_organizatora.pdf')
          b=fitz.open('Materialy_do_druku.pdf')
          assert len(a)==10, f'Instrukcja: {len(a)} stron'
          assert len(b)==25, f'Druk: {len(b)} stron'
          assert 'WOLNOŚĆ' in ''.join(p.get_text() for p in b)
          assert '1987' in ''.join(p.get_text() for p in a)
          print('Kontrola PDF: 10 + 25 stron, kod 1987, słowo WOLNOŚĆ.')
          PY
      - name: Zapisz dwie gotowe publikacje w repozytorium
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Instrukcja_organizatora.pdf Materialy_do_druku.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Odśwież dwa dokumenty: instrukcja i tylko rekwizyty do druku"
            git push
          fi
