name: Dodaj PNG potworow do repozytorium
on:
  push:
    paths:
      - 'narzedzia/karty_png.py'
      - '.github/workflows/karty-png.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generuj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Zainstaluj Pillow
        run: python -m pip install Pillow==11.1.0
      - name: Wygeneruj plik PNG
        run: python narzedzia/karty_png.py
      - name: Dodaj obraz do repozytorium
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 01_Salon_Krypta_Szesciu_Bestii/KARTY_POTWOROW_CZARNO_BIALE.png
          if ! git diff --cached --quiet; then
            git commit -m "Dodaj czarno-białe karty potworów PNG"
            git push
          fi
