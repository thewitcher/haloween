<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Klątwa Siedmiu Światów</title><style>
:root{color-scheme:dark;font-family:Georgia,serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#412943,#100d17 75%);color:#f6e9d2;display:grid;place-items:center;padding:18px}main{width:min(760px,100%);border:1px solid #997651;border-radius:20px;padding:clamp(18px,5vw,42px);background:#17121cef;box-shadow:0 0 80px #000b}h1{text-align:center;color:#f7c777;font-size:clamp(26px,5vw,44px)}h2{color:#f2bc71}p{line-height:1.7}button,input{font:inherit}button{border:1px solid #d0a46b;border-radius:12px;padding:14px 18px;background:#f4bf73;color:#1b1420;font-weight:bold;cursor:pointer;margin:5px}button:disabled{opacity:.5}input[type=text]{width:100%;padding:13px;border:1px solid #a58b73;border-radius:10px;background:#251f2e;color:white;font-size:18px}.row{display:flex;flex-wrap:wrap;gap:9px}.tile{flex:1 1 145px;min-height:75px;background:#2b2032;color:#f2dfc3;border:2px solid #66516c}.tile.selected{border-color:#f9c76f;background:#483047}.avatar{flex:0 0 70px;font-size:33px}.status{background:#32263c;border-radius:12px;padding:12px;margin:14px 0}.paper{white-space:pre-line;font-size:clamp(18px,3vw,23px);line-height:1.75;border-left:3px solid #b89464;padding:8px 0 8px 20px}.timer{font-family:monospace;font-size:clamp(48px,10vw,85px);color:#ffb67b;text-align:center}.center{text-align:center}.muted{color:#c2b2bf}.top{text-align:center;color:#b6a5b6;letter-spacing:2px;font:12px system-ui}#notice{color:#ffc2b0;min-height:25px}
</style></head><body><main><div class="top">✦ HALLOWEEN • PRZYGODA DLA DWÓCH STRAŻNICZEK ✦</div><h1>Klątwa Siedmiu Światów</h1><div id="app"></div><div id="notice" role="alert"></div></main><script>
let role=localStorage.getItem('sw_role'),race='',avatar='',lastKey='',busy=false;
const app=document.querySelector('#app'),notice=document.querySelector('#notice');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,payload){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),d=await r.json();if(!r.ok)throw Error(d.error||'Błąd serwera');return d}
async function action(path,payload={}){if(busy)return;busy=true;try{await api(path,{role,...payload});notice.textContent='';lastKey='';await refresh()}catch(e){notice.textContent=e.message}finally{busy=false}}
function chooseRole(n){role=String(n);localStorage.setItem('sw_role',role);lastKey='';refresh()}
function setRace(v){race=v;document.querySelectorAll('[data-race]').forEach(b=>b.classList.toggle('selected',b.dataset.race===v))}
function setAvatar(v){avatar=v;document.querySelectorAll('[data-avatar]').forEach(b=>b.classList.toggle('selected',b.dataset.avatar===v))}
function findBeast(name){action('/api/world1/find',{beast:name})}
function saveNumber(name){const input=document.getElementById('num-'+name);action('/api/world1/number',{beast:name,number:input.value})}
function sendSeal(){action('/api/world1/answer',{code:document.querySelector('#seal').value})}
function finishEnvelope(){action('/api/world1/envelope')}
function create(){action('/api/create',{name:document.querySelector('#name').value,race,avatar})}
function format(s){return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(v=>String(v).padStart(2,'0')).join(':')}
function render(d){
 if(!role){app.innerHTML='<h2 class="center">Wybierz swój tablet</h2><p class="center muted">Każda dziewczynka wybiera inny numer.</p><div class="row"><button class="tile" onclick="chooseRole(1)">📱 Strażniczka I</button><button class="tile" onclick="chooseRole(2)">📱 Strażniczka II</button></div>';return}
 if(d.phase==='create'){const races=['Elfka Księżyca','Wampirzyca','Wróżka Cieni','Czarownica'],avatars=['🌙','🦇','🧚','🔮','🐈‍⬛','🕯️','🦉','✨'];app.innerHTML='<div class="status">📱 Strażniczka '+role+' — stwórz postać</div><h2>Kim jesteś, Wędrowczyni?</h2><label>Imię bohaterki</label><input id="name" type="text" maxlength="20" placeholder="Wpisz imię" autocomplete="off"><h2>Wybierz rasę</h2><div class="row">'+races.map(x=>'<button class="tile" data-race="'+x+'" onclick="setRace(this.dataset.race)">'+x+'</button>').join('')+'</div><h2>Wybierz awatar</h2><div class="row">'+avatars.map(x=>'<button class="tile avatar" data-avatar="'+x+'" onclick="setAvatar(this.dataset.avatar)">'+x+'</button>').join('')+'</div><p><button onclick="create()">Zapisz bohaterkę →</button></p>';return}
 const me=d.profile,head='<div class="status">'+esc(me.avatar)+' <b>'+esc(me.name)+'</b> — '+esc(me.race)+' · Strażniczka '+role+'</div>';
 if(d.phase==='waiting'){app.innerHTML=head+'<h2>Twoja postać jest gotowa!</h2><p>⏳ Czekamy, aż druga Strażniczka stworzy swoją postać...</p>';return}
 if(d.phase==='story'){const reading=d.reader===role;app.innerHTML=head+(reading?'<div class="status">📖 Twoja kolej! Przeczytaj NA GŁOS. · '+(d.page_index+1)+'/6</div><h2>'+esc(d.page.title)+'</h2><div class="paper">'+esc(d.page.text)+'</div><button onclick="action(\'/api/next\')">Przeczytałam — przekaż opowieść dalej →</button>':'<div class="status">📚 Czyta '+esc(d.players[d.reader]?.name||'druga Strażniczka')+'</div><h2>Posłuchaj opowieści...</h2><p>Nie widzisz jej fragmentu. Posłuchaj uważnie, co przeczyta druga Strażniczka.</p>');return}
 if(d.phase==='oath'){const txt=role==='1'?'Przysięgam strzec światła, nawet gdy pochłonie je ciemność.':'Przysięgam strzec czasu, nawet gdy zegar przestanie bić.';app.innerHTML=head+'<h2>📜 Przysięga Strażniczek</h2><p>Przeczytaj na głos:</p><div class="paper">„'+txt+'”</div>'+(d.oaths[role]?'<div class="status">✔ Przysięga przyjęta. Czekamy na drugą Strażniczkę...</div>':'<p><label><input id="agree" type="checkbox"> Poznałam Siedem Praw i przysięgam ich przestrzegać.</label></p><button onclick="if(document.querySelector(\'#agree\').checked)action(\'/api/oath\');else notice.textContent=\'Zaznacz potwierdzenie.\'">SKŁADAM PRZYSIĘGĘ</button>');return}
 if(d.phase==='playing'){
 const w=d.world1,found=w.found,stage=w.stage;
 let content='<h2 class="center">⏳ ZEGAR MORTHARA</h2><div class="timer">'+format(d.remaining)+'</div><h2 class="center">ŚWIAT I — KRYPTA SZEŚCIU BESTII</h2><p class="center">📍 SALON · 15–20 minut</p><div class="paper">Morthar nie podróżował sam. Kiedy Komnata Cienia została zamknięta, sześć bestii uciekło i ukryło się w tym świecie. Wszystkie wciąż tu są. Znajdźcie je. Sześć bestii. Sześć liczb. Ale tylko cztery powiedzą wam prawdę.</div>';
 if(stage==='search'){
 content+='<div class="status">Odnalezione bestie: '+found.length+'/6 · Spisane cyfry: '+Object.keys(w.numbers).length+'/6</div>';
 if(role==='1'){
 content+='<h2>🔦 Strażniczka I — Łowczyni Bestii</h2><p>Przeszukajcie salon. Gdy znajdziecie papierową bestię, zaznacz ją tutaj i przekaż drugiej Strażniczce cyfrę z tej samej strony karty.</p>';
 content+=w.search_order.map(b=>'<button class="tile '+(found.includes(b)?'selected':'')+'" '+(found.includes(b)?'disabled':'')+' onclick="findBeast(\''+b+'\')">'+esc(b)+' '+(found.includes(b)?'✔':'○')+'</button>').join('');
 }else{
 content+='<h2>📜 Strażniczka II — Kronikarka Cyfr</h2><p>Nie widzisz listy kryjówek. Słuchaj partnerki, zapisuj cyfry z kart odnalezionych kart i zatwierdzaj je.</p>';
 content+=found.map(b=>'<div class="status">'+esc(b)+' '+(w.numbers[b]?'✔ cyfra zapisana':'<input style="width:90px" id="num-'+b+'" type="text" inputmode="numeric" maxlength="1" placeholder="0"><button onclick="saveNumber(\''+b+'\')">Zapisz</button>')+'</div>').join('');
 }
 content+='<p class="muted">Dopiero po odnalezieniu wszystkich sześciu bestii i zapisaniu ich cyfr Morthar ujawni kolejną próbę.</p>';
 }else if(stage==='solve'){
 content+='<h2>🔐 Cztery prawdziwe bestie</h2><p>Wiedźma i Kościotrup służą Mortharowi. Tylko cztery inne bestie tworzą pieczęć.</p>';
 if(role==='2'){content+='<div class="paper"><b>Zagadki z Kroniki Bestii:</b>\n\n1. Nie żyję, lecz budzę się nocą. Słońce jest moim wrogiem, a kiedy jestem głodny, patrzę na twoją szyję.\n\n2. Kiedy księżyc staje się okrągły, człowiek przestaje być człowiekiem.\n\n3. Nie mam ciała, ale czasem zostawiam ślady. Możesz mnie zobaczyć, lecz nie możesz mnie złapać.\n\n4. Umarłem bardzo dawno temu. Owinięto mnie, żebym mógł czekać wiecznie.\n\n<b>Prawo kolejności:</b> Pierwszy boi się słońca. Ostatni został przygotowany do wieczności. Ten, który pojawia się przy pełni, stoi przed tym, którego można zobaczyć, lecz nie dotknąć.</div><p>Przeczytaj zagadki partnerce i wspólnie ustalcie kolejność.</p>'}
 else{content+='<div class="paper"><b>Twoja karta odnalezionych bestii:</b>\n\n'+w.search_order.map(b=>b+' — '+(w.numbers[b]||'cyfra zapisana u partnerki')).join('\n')+'</div><p>Druga Strażniczka ma zagadki i reguły kolejności. Wysłuchaj ich. Ułóżcie razem czterocyfrową pieczęć.</p>'}
 content+=w.answers[role]?'<div class="status">✔ Twoja pieczęć przyjęta. Czekamy na partnerkę.</div>':'<h2>Wpisz czterocyfrowy kod</h2><input id="seal" type="text" inputmode="numeric" maxlength="4" placeholder="□□□□"><button onclick="sendSeal()">ZŁAM PIECZĘĆ</button>';
 }else{
 content+='<h2>🔓 PIERWSZA PIECZĘĆ ZŁAMANA!</h2><div class="status center" style="font-size:32px">ODKRYTY KOD: <strong>7219</strong></div><div class="paper">Dobrze. Jedna z siedmiu pieczęci została złamana. Ale Morthar już wie, że tu jesteście. Nie traćcie czasu.\n\n<b>W tym świecie pozostało coś jeszcze.</b>\n\nTam, gdzie miękkie pożera zmęczonych, a zagubione monety znikają między szczelinami.</div><p>Odnajdźcie kopertę oznaczoną numerem 1 i zachowajcie jej zawartość do finału.</p>';
 if(stage==='envelope'){content+=w.envelope[role]?'<div class="status">✔ Potwierdzono. Czekamy na partnerkę.</div>':'<button onclick="finishEnvelope()">MAM FRAGMENT PIECZĘCI NR 1</button>'}
 else{content+='<div class="status">✔ Obie Strażniczki potwierdziły odnalezienie fragmentu nr 1.</div><h2>ŚWIAT II — GALERIA LUSTRZANYCH SZEPTÓW</h2><p>📍 SYPIALNIA. Możecie przejść do następnego pomieszczenia. Zagadki tego świata dodamy w kolejnym etapie.</p>'}
 }
 app.innerHTML=head+content;
 }
}
async function refresh(){if(!role){render({});return}try{const r=await fetch('/api/state?role='+role,{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error);const key=[d.phase,d.page_index,d.reader,d.oaths['1'],d.oaths['2'],d.players['1']?.name,d.players['2']?.name,d.world1.stage,d.world1.found.join(','),d.world1.number_count,d.world1.answers['1'],d.world1.answers['2'],d.world1.envelope['1'],d.world1.envelope['2']].join('|');if(key!==lastKey){lastKey=key;render(d)}else if(d.phase==='playing'){const t=document.querySelector('.timer');if(t)t.textContent=format(d.remaining)}}catch(e){notice.textContent='Brak połączenia z serwerem: '+e.message}}
refresh();setInterval(refresh,1000);
</script></body></html>
